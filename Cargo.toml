[package]
name = "hnsw"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "HNSW approximate nearest-neighbor index over fixed-size f32 vectors, with validated inputs, stable ids and crash-safe versioned snapshots"
repository = "https://github.com/DaniAreddu/hnsw"
readme = "README.md"
keywords = ["hnsw", "ann", "nearest-neighbor", "vector-search", "similarity"]
categories = ["algorithms", "data-structures"]
include = ["/src/**/*.rs", "/README.md", "/LICENSE", "/CHANGELOG.md", "/docs/SNAPSHOT_FORMAT.md"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
crc32fast = "1.5.0"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
hnsw-pq = { path = "crates/pq", version = "0.1.0", optional = true }
rayon = { version = "1.12.0", optional = true }

[dev-dependencies]
crc32fast = "1.5.0"
serde = { version = "1.0.228", features = ["derive"] }

[features]
# Experimental product-quantized index (hnsw::pq). Not covered by the v0.1
# compatibility contract: no persistence, no insertion, no exact rescoring.
experimental-pq = ["dep:hnsw-pq", "dep:rayon"]

[workspace]
members = ["crates/bench", "crates/pq"]
# cargo-fuzz project with its own workspace and lockfile (nightly only)
exclude = ["fuzz"]

[profile.release]
debug = true
split-debuginfo = "packed"
