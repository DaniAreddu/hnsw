[package]
name = "hnsw-bench"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Benchmark runner for the hnsw crate (not published)"

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
hnsw = { path = "../.." }
pq = { path = "../../pq" }
hdf5 = "0.8.1"
hdf5-sys = { version = "0.8.1", features = ["static"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.4"
