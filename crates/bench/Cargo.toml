[package]
name = "hnsw-bench"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Benchmark runner for the hnsw crate (not published)"

[[bin]]
name = "bench"
path = "src/main.rs"

[features]
# Reading ANN-benchmarks HDF5 files builds HDF5 from source (needs CMake).
# Synthetic datasets work without it.
hdf5 = ["dep:hdf5", "dep:hdf5-sys"]

[dependencies]
hnsw = { path = "../.." }
pq = { package = "hnsw-pq", path = "../pq" }
hdf5 = { version = "0.8.1", optional = true }
hdf5-sys = { version = "0.8.1", features = ["static"], optional = true }
rand = "0.10.1"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.1.4"
