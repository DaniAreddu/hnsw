# cargo-deny configuration. CI runs: cargo deny --all-features check
# The advisory database is fetched at run time, so a newly published
# advisory can fail CI without a code change; that is intentional.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
# Temporary exception: the library still depends on the pq submodule through a
# path-only dependency, which crates.io cannot resolve. The PQ packaging change
# replaces it with a versioned workspace crate and restores "deny".
wildcards = "warn"
# Workspace path dependencies carry no version requirement.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
