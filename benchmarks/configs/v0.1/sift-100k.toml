# v0.1 release benchmark, small dataset: first 100k vectors of SIFT-128.
# Ground truth is recomputed by brute force for the truncated base set.
dataset_path = "data/sift-128-euclidean.hdf5"
dimension = 128
top_k = 10
base_limit = 100000
query_limit = 1000
warmup_queries = 100
query_cycles = 5
seed = 42
ef_searches = [16, 32, 64, 128, 256]
output_json = "benchmarks/results/v0.1/sift-100k.json"

[[configs]]
m = 16
m0 = 32
ef_construction = 128

[[configs]]
m = 16
m0 = 32
ef_construction = 128
build_mode = "batched"
build_threads = 8
